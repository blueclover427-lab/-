<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 부부 가계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <section id="authSection" class="max-w-md mx-auto bg-white rounded-xl shadow p-4 mt-8">
      <h2 class="text-lg font-bold mb-4">로그인</h2>
      <div class="space-y-3">
        <input id="email" type="email" placeholder="이메일" class="w-full border rounded-lg px-3 py-2" />
        <input id="password" type="password" placeholder="비밀번호" class="w-full border rounded-lg px-3 py-2" />
        <button id="loginBtn" class="w-full bg-indigo-600 text-white rounded-lg px-3 py-2">로그인</button>
        <p id="authStatus" class="text-sm text-slate-500">등록된 부부 계정만 로그인할 수 있습니다.</p>
      </div>
    </section>

    <section id="appSection" class="hidden space-y-6">
      <header class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-indigo-600">실시간 부부 가계부</h1>
          <p id="userInfo" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <div class="flex items-center gap-3">
          <span id="syncStatus" class="text-xs text-slate-500">연결 중...</span>
          <button id="logoutBtn" class="px-3 py-1.5 border rounded-lg text-xs text-slate-600">로그아웃</button>
        </div>
      </header>

      <section class="bg-white rounded-xl shadow p-4 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-slate-800">공통 필터</h2>
          <button id="btnClearFilter" class="px-3 py-1.5 border rounded-lg text-xs text-slate-600">필터 초기화</button>
        </div>
        <div class="grid md:grid-cols-2 gap-2 text-xs">
          <select id="globalCategoryFilter" class="border rounded-lg px-3 py-2">
            <option value="">전체 카테고리</option>
          </select>
          <select id="globalMethodFilter" class="border rounded-lg px-3 py-2">
            <option value="">전체 결제수단</option>
          </select>
        </div>
        <p class="text-[11px] text-slate-400">이 필터는 상단 요약, 그래프, 지출 내역 전체에 적용됩니다.</p>
      </section>

      <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">이번 달 합계</div>
          <div id="kpiTotal" class="text-lg font-bold mt-1">0원</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">건수</div>
          <div id="kpiCount" class="text-lg font-bold mt-1">0건</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">평균 지출</div>
          <div id="kpiAvg" class="text-lg font-bold mt-1">0원</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">마지막 수정</div>
          <div id="kpiUpdated" class="text-[11px] font-semibold mt-1 text-slate-700">-</div>
        </div>
      </section>

      <section class="bg-white rounded-xl shadow p-4 space-y-4">
        <div class="flex justify-between items-center">
          <h2 id="formTitle" class="text-sm font-bold text-slate-800">새 지출 입력</h2>
          <span id="editBadge" class="hidden text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-700">수정 모드</span>
        </div>

        <form id="entryForm" class="grid md:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block mb-1 text-slate-600">날짜</label>
            <input type="date" id="fDate" class="w-full border rounded-lg px-2 py-1.5 text-sm" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">카테고리</label>
            <div class="grid gap-1.5">
              <select id="fCategoryPreset" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                <option value="">드롭박스에서 선택</option>
                <option value="식비">식비</option>
                <option value="육아">육아</option>
                <option value="교육">교육</option>
                <option value="주거">주거</option>
                <option value="교통">교통</option>
                <option value="쇼핑">쇼핑</option>
                <option value="의료">의료</option>
                <option value="외식">외식</option>
                <option value="통신">통신</option>
                <option value="생활">생활</option>
                <option value="보험">보험</option>
                <option value="기타">기타</option>
              </select>
              <input id="fCategory" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="또는 직접 입력" required />
            </div>
          </div>
          <div>
            <label class="block mb-1 text-slate-600">지출처</label>
            <input id="fPlace" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="예: 이마트, 약국" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">결제수단</label>
            <div class="grid gap-1.5">
              <select id="fMethodPreset" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                <option value="">드롭박스에서 선택</option>
                <option value="국민카드">국민카드</option>
                <option value="하나카드">하나카드</option>
                <option value="삼성카드">삼성카드</option>
                <option value="계좌이체">계좌이체</option>
                <option value="현금">현금</option>
              </select>
              <input id="fMethod" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="또는 직접 입력" required />
            </div>
          </div>
          <div>
            <label class="block mb-1 text-slate-600">금액 (원)</label>
            <input id="fAmount" class="w-full border rounded-lg px-2 py-1.5 text-sm text-right" placeholder="0" inputmode="numeric" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">메모</label>
            <input id="fMemo" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="선택 사항" />
          </div>
          <div class="md:col-span-2 flex gap-2 mt-2">
            <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2 rounded-lg">저장하기</button>
            <button type="button" id="btnCancelEdit" class="hidden px-3 py-2 border rounded-lg text-xs text-amber-700 border-amber-300">수정 취소</button>
            <button type="button" id="btnReset" class="px-3 py-2 border rounded-lg text-xs text-slate-600">폼 초기화</button>
          </div>
        </form>
      </section>

      <section class="bg-white rounded-xl shadow p-4 space-y-4">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <h2 class="text-sm font-bold text-slate-800">지출 그래프 요약</h2>
          <div class="flex gap-2 text-xs">
            <select id="periodType" class="border rounded-lg px-2 py-1.5">
              <option value="month">월별 보기</option>
              <option value="year">연도별 보기</option>
            </select>
            <select id="periodValue" class="border rounded-lg px-2 py-1.5"></select>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div class="border rounded-xl p-3">
            <h3 class="text-xs font-semibold text-slate-600 mb-2">카테고리 구성</h3>
            <canvas id="categoryDonutChart" height="280"></canvas>
          </div>
          <div class="border rounded-xl p-3">
            <h3 class="text-xs font-semibold text-slate-600 mb-2">카테고리별 합계</h3>
            <canvas id="categoryChart" height="280"></canvas>
          </div>
        </div>

        <div class="border rounded-xl p-3">
          <h3 class="text-xs font-semibold text-slate-600 mb-2">기간 흐름</h3>
          <canvas id="trendChart" height="130"></canvas>
        </div>
      </section>

      <section class="bg-white rounded-xl shadow p-4 space-y-3">
        <div class="flex justify-between items-center text-xs">
          <h2 class="font-bold text-slate-800">지출 내역</h2>
          <span id="rowCount" class="text-slate-400">0건</span>
        </div>

        <div class="grid md:grid-cols-2 gap-2 text-xs">
          <input id="listSearch" class="border rounded-lg px-3 py-2" placeholder="검색어 (지출처, 메모, 카테고리, 결제수단)" />
          <button id="btnClearSearch" class="border rounded-lg px-3 py-2 text-slate-600">검색 초기화</button>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-[11px]">
            <thead class="bg-slate-100 text-slate-600">
              <tr>
                <th class="px-2 py-1 text-left">날짜</th>
                <th class="px-2 py-1 text-left">카테고리</th>
                <th class="px-2 py-1 text-left">지출처</th>
                <th class="px-2 py-1 text-left">결제수단</th>
                <th class="px-2 py-1 text-right">금액</th>
                <th class="px-2 py-1 text-left">메모</th>
                <th class="px-2 py-1 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBQ9xAaHvj8EetPngUcikGgfXog9-2kvhE",
      authDomain: "household-ledger-c5ff8.firebaseapp.com",
      databaseURL: "https://household-ledger-c5ff8-default-rtdb.firebaseio.com",
      projectId: "household-ledger-c5ff8",
      storageBucket: "household-ledger-c5ff8.firebasestorage.app",
      messagingSenderId: "671578590446",
      appId: "1:671578590446:web:a8463d32a79cf9af17f7ff",
      measurementId: "G-JVX0VJ7778"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const entriesRef = ref(db, "ledgerEntries");

    const allowedEmails = ["blueclover427@gmail.com", "florencia_11@naver.com"].map(v => v.toLowerCase());
    const fmt = n => `${(Number(n) || 0).toLocaleString("ko-KR")}원`;
    const today = () => new Date().toISOString().slice(0, 10);

    const els = {
      authSection: document.getElementById("authSection"),
      appSection: document.getElementById("appSection"),
      email: document.getElementById("email"),
      password: document.getElementById("password"),
      loginBtn: document.getElementById("loginBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      authStatus: document.getElementById("authStatus"),
      userInfo: document.getElementById("userInfo"),
      syncStatus: document.getElementById("syncStatus"),

      globalCategoryFilter: document.getElementById("globalCategoryFilter"),
      globalMethodFilter: document.getElementById("globalMethodFilter"),
      btnClearFilter: document.getElementById("btnClearFilter"),

      kpiTotal: document.getElementById("kpiTotal"),
      kpiCount: document.getElementById("kpiCount"),
      kpiAvg: document.getElementById("kpiAvg"),
      kpiUpdated: document.getElementById("kpiUpdated"),

      entryForm: document.getElementById("entryForm"),
      formTitle: document.getElementById("formTitle"),
      editBadge: document.getElementById("editBadge"),
      submitBtn: document.getElementById("submitBtn"),
      btnCancelEdit: document.getElementById("btnCancelEdit"),
      btnReset: document.getElementById("btnReset"),

      fDate: document.getElementById("fDate"),
      fCategoryPreset: document.getElementById("fCategoryPreset"),
      fCategory: document.getElementById("fCategory"),
      fPlace: document.getElementById("fPlace"),
      fMethodPreset: document.getElementById("fMethodPreset"),
      fMethod: document.getElementById("fMethod"),
      fAmount: document.getElementById("fAmount"),
      fMemo: document.getElementById("fMemo"),

      periodType: document.getElementById("periodType"),
      periodValue: document.getElementById("periodValue"),

      listSearch: document.getElementById("listSearch"),
      btnClearSearch: document.getElementById("btnClearSearch"),
      rowCount: document.getElementById("rowCount"),
      tableBody: document.getElementById("tableBody"),

      categoryDonutChart: document.getElementById("categoryDonutChart"),
      categoryChart: document.getElementById("categoryChart"),
      trendChart: document.getElementById("trendChart")
    };

    const categoryColorMap = {
      식비:   { bg: "rgba(239,68,68,0.82)", border: "#dc2626" },
      육아:   { bg: "rgba(249,115,22,0.82)", border: "#ea580c" },
      교육:   { bg: "rgba(234,179,8,0.82)", border: "#ca8a04" },
      주거:   { bg: "rgba(34,197,94,0.82)", border: "#16a34a" },
      교통:   { bg: "rgba(6,182,212,0.82)", border: "#0891b2" },
      쇼핑:   { bg: "rgba(59,130,246,0.82)", border: "#2563eb" },
      의료:   { bg: "rgba(99,102,241,0.82)", border: "#4f46e5" },
      외식:   { bg: "rgba(168,85,247,0.82)", border: "#9333ea" },
      통신:   { bg: "rgba(236,72,153,0.82)", border: "#db2777" },
      생활:   { bg: "rgba(20,184,166,0.82)", border: "#0f766e" },
      보험:   { bg: "rgba(132,204,22,0.82)", border: "#65a30d" },
      기타:   { bg: "rgba(148,163,184,0.82)", border: "#64748b" }
    };

    const state = {
      rows: [],
      editingId: null,
      unsubscribe: null,
      charts: { donut: null, bar: null, line: null }
    };

    const isAllowedEmail = email => allowedEmails.includes(String(email || "").trim().toLowerCase());
    const amountToNumber = value => Number(String(value || "").replace(/[^0-9]/g, "")) || 0;
    const formatInputNumber = value => String(value).replace(/[^0-9]/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    function fillSelect(selectEl, items, defaultLabel, keepValue = true) {
      const current = keepValue ? selectEl.value : "";
      selectEl.innerHTML = `<option value="">${defaultLabel}</option>`;
      [...new Set(items.filter(Boolean))].sort().forEach(v => {
        const option = document.createElement("option");
        option.value = v;
        option.textContent = v;
        selectEl.appendChild(option);
      });
      if ([...selectEl.options].some(o => o.value === current)) selectEl.value = current;
    }

    function setPreset(selectEl, inputEl) {
      if (selectEl.value) inputEl.value = selectEl.value;
    }

    function toggleEditMode(on, row = null) {
      state.editingId = on ? row.id : null;
      els.formTitle.textContent = on ? "지출 내역 수정" : "새 지출 입력";
      els.submitBtn.textContent = on ? "수정 저장" : "저장하기";
      els.editBadge.classList.toggle("hidden", !on);
      els.btnCancelEdit.classList.toggle("hidden", !on);

      if (!on) {
        els.entryForm.reset();
        els.fDate.value = today();
        return;
      }

      els.fDate.value = row.date || today();
      els.fCategory.value = row.category || "";
      els.fCategoryPreset.value = row.category || "";
      els.fPlace.value = row.place || "";
      els.fMethod.value = row.method || "";
      els.fMethodPreset.value = row.method || "";
      els.fAmount.value = formatInputNumber(row.amount || "");
      els.fMemo.value = row.memo || "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getCurrentMonthRows(rows) {
      const now = new Date();
      const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      return rows.filter(r => (r.date || "").startsWith(ym));
    }

    function getFilteredRows() {
      const category = els.globalCategoryFilter.value;
      const method = els.globalMethodFilter.value;
      const search = els.listSearch.value.trim().toLowerCase();
      const periodValue = els.periodValue.value;

      const globalRows = state.rows.filter(r =>
        (!category || r.category === category) &&
        (!method || r.method === method)
      );

      const periodRows = periodValue
        ? globalRows.filter(r => (r.date || "").startsWith(periodValue))
        : globalRows;

      const searchedRows = periodRows.filter(r =>
        !search ||
        [r.place, r.memo, r.category, r.method, r.date, String(r.amount || "")]
          .filter(Boolean)
          .some(v => String(v).toLowerCase().includes(search))
      );

      return { globalRows, periodRows, searchedRows };
    }

    function getCategorySummary(rows) {
      const map = {};
      rows.forEach(r => {
        const key = r.category || "기타";
        map[key] = (map[key] || 0) + (Number(r.amount) || 0);
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    function getTrendData(rows, type, selectedValue) {
      if (!selectedValue) return { labels: [], sums: [], label: "기간 지출" };

      if (type === "month") {
        const base = new Date(`${selectedValue}-01`);
        const days = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
        const labels = Array.from({ length: days }, (_, i) => String(i + 1));
        const sums = Array(days).fill(0);

        rows.forEach(r => {
          const day = Number((r.date || "").slice(8, 10));
          if (day >= 1 && day <= days) sums[day - 1] += Number(r.amount) || 0;
        });
        return { labels, sums, label: `${selectedValue} 일별 지출` };
      }

      const labels = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
      const sums = Array(12).fill(0);
      rows.forEach(r => {
        const month = Number((r.date || "").slice(5, 7));
        if (month >= 1 && month <= 12) sums[month - 1] += Number(r.amount) || 0;
      });
      return { labels, sums, label: `${selectedValue} 월별 지출` };
    }

    function getCategoryColors(labels) {
      return {
        backgrounds: labels.map(l => (categoryColorMap[l] || categoryColorMap["기타"]).bg),
        borders: labels.map(l => (categoryColorMap[l] || categoryColorMap["기타"]).border)
      };
    }

    function createChart(instance, canvas, config) {
      return instance ? (Object.assign(instance.data, config.data), Object.assign(instance.options, config.options || {}), instance.update(), instance) : new Chart(canvas, config);
    }

    function updateKpis(globalRows) {
      const monthRows = getCurrentMonthRows(globalRows);
      const total = monthRows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);
      els.kpiTotal.textContent = fmt(total);
      els.kpiCount.textContent = `${monthRows.length}건`;
      els.kpiAvg.textContent = monthRows.length ? fmt(Math.round(total / monthRows.length)) : "0원";
      els.kpiUpdated.textContent = globalRows.length ? new Date().toLocaleString("ko-KR") : "-";
    }

    function updatePeriodOptions(globalRows) {
      const type = els.periodType.value;
      const current = els.periodValue.value;
      const values = [...new Set(globalRows.map(r => (r.date || "").slice(0, type === "month" ? 7 : 4)).filter(Boolean))].sort().reverse();

      els.periodValue.innerHTML = "";
      values.forEach(v => {
        const option = document.createElement("option");
        option.value = v;
        option.textContent = type === "month" ? `${v} 기준` : `${v}년 기준`;
        els.periodValue.appendChild(option);
      });

      if (values.includes(current)) els.periodValue.value = current;
      else if (values.length) els.periodValue.value = values[0];
    }

    function renderCharts(periodRows) {
      const summary = getCategorySummary(periodRows);
      const labels = summary.map(v => v[0]);
      const values = summary.map(v => v[1]);
      const total = values.reduce((a, b) => a + b, 0);
      const colors = getCategoryColors(labels);
      const empty = !labels.length;
      const trend = getTrendData(periodRows, els.periodType.value, els.periodValue.value);

      state.charts.donut = createChart(state.charts.donut, els.categoryDonutChart, {
        type: "doughnut",
        data: {
          labels: empty ? ["데이터 없음"] : labels,
          datasets: [{
            data: empty ? [1] : values,
            backgroundColor: empty ? ["rgba(203,213,225,0.9)"] : colors.backgrounds,
            borderColor: "#ffffff",
            borderWidth: 2,
            hoverOffset: 6
          }]
        },
        plugins: [ChartDataLabels],
        options: {
          responsive: true,
          layout: { padding: 12 },
          cutout: "42%",
          plugins: {
            legend: { display: false },
            datalabels: {
              color: "#ffffff",
              textAlign: "center",
              font: ctx => {
                const value = ctx.dataset.data[ctx.dataIndex];
                const pct = total ? (value / total) * 100 : 0;
                const mobile = ctx.chart.width < 520;
                return { weight: "700", size: mobile ? (pct >= 20 ? 12 : 10) : (pct >= 20 ? 18 : 15), lineHeight: 1.15 };
              },
              formatter: (value, ctx) => {
                if (empty) return "데이터 없음";
                const label = ctx.chart.data.labels[ctx.dataIndex];
                const pct = total ? (value / total) * 100 : 0;
                if (pct < 8) return "...";
                return [String(label).slice(0, 6), `${Number(value).toLocaleString("ko-KR")}원`, `${pct.toFixed(1)}%`];
              },
              anchor: "center",
              align: "center",
              offset: 0,
              clamp: true,
              clip: true,
              textStrokeColor: "rgba(0,0,0,0.18)",
              textStrokeWidth: 2
            },
            tooltip: {
              callbacks: {
                label: ctx => empty ? "데이터 없음" : `${ctx.label}: ${Number(ctx.raw).toLocaleString("ko-KR")}원 (${total ? ((ctx.raw / total) * 100).toFixed(1) : "0.0"}%)`
              }
            }
          }
        }
      });

      state.charts.bar = createChart(state.charts.bar, els.categoryChart, {
        type: "bar",
        data: {
          labels: empty ? ["데이터 없음"] : labels,
          datasets: [{
            label: "카테고리별 지출",
            data: empty ? [0] : values,
            backgroundColor: empty ? ["rgba(203,213,225,0.9)"] : colors.backgrounds,
            borderColor: empty ? ["#94a3b8"] : colors.borders,
            borderWidth: 1.5,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#475569" }, grid: { display: false } },
            y: {
              beginAtZero: true,
              ticks: { color: "#475569", callback: value => `${Number(value).toLocaleString("ko-KR")}원` }
            }
          }
        }
      });

      state.charts.line = createChart(state.charts.line, els.trendChart, {
        type: "line",
        data: {
          labels: trend.labels,
          datasets: [{
            label: trend.label,
            data: trend.sums,
            borderColor: "#0f766e",
            backgroundColor: "rgba(20,184,166,0.18)",
            fill: true,
            tension: 0.25,
            pointBackgroundColor: "#0f766e",
            pointBorderColor: "#ffffff",
            pointBorderWidth: 2,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: true } },
          scales: {
            x: { ticks: { color: "#475569" }, grid: { display: false } },
            y: {
              beginAtZero: true,
              ticks: { color: "#475569", callback: value => `${Number(value).toLocaleString("ko-KR")}원` }
            }
          }
        }
      });
    }

    function renderTable(rows) {
      els.rowCount.textContent = `${rows.length}건`;
      els.tableBody.innerHTML = rows.map(r => `
        <tr class="hover:bg-slate-50">
          <td class="px-2 py-1 whitespace-nowrap">${r.date || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.category || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.place || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.method || "-"}</td>
          <td class="px-2 py-1 text-right font-semibold">${fmt(r.amount)}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.memo || "-"}</td>
          <td class="px-2 py-1 text-center">
            <div class="flex justify-center gap-1">
              <button data-action="edit" data-id="${r.id}" class="text-[10px] text-indigo-600 border border-indigo-500 px-1.5 py-0.5 rounded">수정</button>
              <button data-action="delete" data-id="${r.id}" class="text-[10px] text-rose-500 border border-rose-500 px-1.5 py-0.5 rounded">삭제</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function renderAll() {
      fillSelect(els.globalCategoryFilter, state.rows.map(r => r.category), "전체 카테고리");
      fillSelect(els.globalMethodFilter, state.rows.map(r => r.method), "전체 결제수단");

      const previewGlobalRows = state.rows.filter(r =>
        (!els.globalCategoryFilter.value || r.category === els.globalCategoryFilter.value) &&
        (!els.globalMethodFilter.value || r.method === els.globalMethodFilter.value)
      );

      updateKpis(previewGlobalRows);
      updatePeriodOptions(previewGlobalRows);

      const { globalRows, periodRows, searchedRows } = getFilteredRows();
      updateKpis(globalRows);
      renderCharts(periodRows);
      renderTable(searchedRows);
    }

    async function handleLogin() {
      const email = els.email.value.trim();
      const password = els.password.value;

      if (!email || !password) {
        els.authStatus.textContent = "이메일과 비밀번호를 입력해주세요.";
        return;
      }

      try {
        els.authStatus.textContent = "로그인 중...";
        const cred = await signInWithEmailAndPassword(auth, email, password);
        if (!isAllowedEmail(cred.user.email)) {
          await signOut(auth);
          els.authStatus.textContent = "허용된 계정이 아닙니다.";
          return;
        }
        els.authStatus.textContent = "로그인 성공";
      } catch (err) {
        els.authStatus.textContent = `로그인 실패: ${err.message}`;
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();

      const user = auth.currentUser;
      if (!user || !isAllowedEmail(user.email)) {
        alert("허용된 가족 계정으로 로그인해주세요.");
        return;
      }

      const payload = {
        date: els.fDate.value,
        category: els.fCategory.value.trim() || "기타",
        place: els.fPlace.value.trim(),
        method: els.fMethod.value.trim(),
        amount: amountToNumber(els.fAmount.value),
        memo: els.fMemo.value.trim()
      };

      if (!payload.date || !payload.place || !payload.method || payload.amount <= 0) {
        alert("날짜 / 지출처 / 결제수단 / 금액을 확인해주세요.");
        return;
      }

      try {
        if (state.editingId) {
          await update(ref(db, `ledgerEntries/${state.editingId}`), {
            ...payload,
            updatedAt: Date.now(),
            updatedBy: user.email || ""
          });
        } else {
          await set(push(entriesRef), {
            ...payload,
            createdAt: Date.now(),
            createdBy: user.email || ""
          });
        }
        toggleEditMode(false);
      } catch (err) {
        alert(`저장 실패: ${err.message}`);
      }
    }

    function bindEvents() {
      [
        [els.loginBtn, "click", handleLogin],
        [els.logoutBtn, "click", () => signOut(auth)],
        [els.entryForm, "submit", handleSubmit],
        [els.btnReset, "click", () => toggleEditMode(false)],
        [els.btnCancelEdit, "click", () => toggleEditMode(false)],
        [els.btnClearFilter, "click", () => {
          els.globalCategoryFilter.value = "";
          els.globalMethodFilter.value = "";
          renderAll();
        }],
        [els.btnClearSearch, "click", () => {
          els.listSearch.value = "";
          renderAll();
        }],
        [els.fCategoryPreset, "change", () => setPreset(els.fCategoryPreset, els.fCategory)],
        [els.fMethodPreset, "change", () => setPreset(els.fMethodPreset, els.fMethod)],
        [els.fAmount, "input", e => e.target.value = formatInputNumber(e.target.value)],
        [els.password, "keydown", e => e.key === "Enter" && handleLogin()]
      ].forEach(([el, event, fn]) => el.addEventListener(event, fn));

      [els.globalCategoryFilter, els.globalMethodFilter, els.periodType, els.periodValue].forEach(el => {
        el.addEventListener("change", renderAll);
      });

      els.listSearch.addEventListener("input", renderAll);

      els.tableBody.addEventListener("click", async e => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;

        const id = btn.dataset.id;
        const row = state.rows.find(r => r.id === id);
        if (!row) return;

        if (btn.dataset.action === "edit") {
          toggleEditMode(true, row);
          return;
        }

        if (btn.dataset.action === "delete" && confirm("이 내역을 삭제할까요?")) {
          try {
            await remove(ref(db, `ledgerEntries/${id}`));
            if (state.editingId === id) toggleEditMode(false);
          } catch (err) {
            alert(`삭제 실패: ${err.message}`);
          }
        }
      });

      window.addEventListener("resize", renderAll);
    }

    function startEntriesListener() {
      if (state.unsubscribe) state.unsubscribe();

      state.unsubscribe = onValue(entriesRef, snapshot => {
        const rows = [];
        snapshot.forEach(child => rows.push({ id: child.key, ...child.val() }));
        state.rows = rows.sort((a, b) => `${b.date || ""}-${b.createdAt || 0}`.localeCompare(`${a.date || ""}-${a.createdAt || 0}`));
        els.syncStatus.textContent = "연결됨";
        renderAll();
      }, () => {
        els.syncStatus.textContent = "연결 오류";
      });
    }

    onAuthStateChanged(auth, async user => {
      if (!user) {
        els.authSection.classList.remove("hidden");
        els.appSection.classList.add("hidden");
        els.userInfo.textContent = "";
        els.syncStatus.textContent = "로그아웃됨";
        state.rows = [];
        if (state.unsubscribe) {
          state.unsubscribe();
          state.unsubscribe = null;
        }
        return;
      }

      if (!isAllowedEmail(user.email)) {
        await signOut(auth);
        els.authStatus.textContent = "허용된 계정만 사용할 수 있습니다.";
        return;
      }

      els.authSection.classList.add("hidden");
      els.appSection.classList.remove("hidden");
      els.userInfo.textContent = `로그인 계정: ${user.email}`;
      els.syncStatus.textContent = "데이터 불러오는 중...";
      startEntriesListener();
    });

    els.fDate.value = today();
    bindEvents();
  </script>
</body>
</html>
