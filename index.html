<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 부부 가계부</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <main class="max-w-6xl mx-auto p-4 space-y-4">

    <section id="authSection" class="max-w-md mx-auto bg-white rounded-xl shadow p-4 mt-6">
      <h2 class="text-lg font-bold mb-4">로그인 / 회원가입</h2>
      <div class="space-y-3">
        <input id="email" type="email" placeholder="이메일" class="w-full border rounded-lg px-3 py-2" />
        <input id="password" type="password" placeholder="비밀번호" class="w-full border rounded-lg px-3 py-2" />
        <div class="flex gap-2">
          <button id="loginBtn" class="flex-1 bg-indigo-600 text-white rounded-lg px-3 py-2">로그인</button>
          <button id="signupBtn" class="flex-1 border rounded-lg px-3 py-2">회원가입</button>
        </div>
        <p id="authStatus" class="text-sm text-slate-500">로그인이 필요합니다.</p>
      </div>
    </section>

    <section id="appSection" class="hidden space-y-6">
      <header class="flex justify-between items-center">
        <div>
          <h1 class="text-xl font-bold text-indigo-600">실시간 부부 가계부</h1>
          <p id="userInfo" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <div class="flex items-center gap-3">
          <span id="sync-status" class="text-xs text-slate-500">연결 중...</span>
          <button id="logoutBtn" class="px-3 py-1.5 border rounded-lg text-xs text-slate-600">로그아웃</button>
        </div>
      </header>

      <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">이번 달 합계</div>
          <div id="kpi-total" class="text-lg font-bold mt-1">0원</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">건수</div>
          <div id="kpi-count" class="text-lg font-bold mt-1">0건</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">평균 지출</div>
          <div id="kpi-avg" class="text-lg font-bold mt-1">0원</div>
        </div>
        <div class="bg-white rounded-xl shadow p-3 text-xs">
          <div class="text-slate-400">마지막 수정</div>
          <div id="kpi-updated" class="text-[11px] font-semibold mt-1 text-slate-700">-</div>
        </div>
      </section>

      <section class="bg-white rounded-xl shadow p-4 space-y-4">
        <div class="flex justify-between items-center">
          <h2 id="formTitle" class="text-sm font-bold text-slate-800">새 지출 입력</h2>
          <span id="editBadge" class="hidden text-[11px] px-2 py-1 rounded-full bg-amber-100 text-amber-700">수정 모드</span>
        </div>

        <form id="entryForm" class="grid md:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block mb-1 text-slate-600">날짜</label>
            <input type="date" id="fDate" class="w-full border rounded-lg px-2 py-1.5 text-sm" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">카테고리</label>
            <div class="grid gap-1.5">
              <select id="fCategoryPreset" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                <option value="">드롭박스에서 선택</option>
                <option value="식비">식비</option>
                <option value="육아">육아</option>
                <option value="교육">교육</option>
                <option value="주거">주거</option>
                <option value="교통">교통</option>
                <option value="쇼핑">쇼핑</option>
                <option value="의료">의료</option>
                <option value="외식">외식</option>
                <option value="통신">통신</option>
                <option value="생활">생활</option>
                <option value="보험">보험</option>
                <option value="기타">기타</option>
              </select>
              <input id="fCategory" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="또는 직접 입력" required />
            </div>
          </div>
          <div>
            <label class="block mb-1 text-slate-600">지출처</label>
            <input id="fPlace" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="예: 이마트, 약국" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">결제수단</label>
            <div class="grid gap-1.5">
              <select id="fMethodPreset" class="w-full border rounded-lg px-2 py-1.5 text-sm">
                <option value="">드롭박스에서 선택</option>
                <option value="국민카드">국민카드</option>
                <option value="하나카드">하나카드</option>
                <option value="삼성카드">삼성카드</option>
                <option value="계좌이체">계좌이체</option>
                <option value="현금">현금</option>
              </select>
              <input id="fMethod" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="또는 직접 입력" required />
            </div>
          </div>
          <div>
            <label class="block mb-1 text-slate-600">금액 (원)</label>
            <input id="fAmount" class="w-full border rounded-lg px-2 py-1.5 text-sm text-right" placeholder="0" inputmode="numeric" required />
          </div>
          <div>
            <label class="block mb-1 text-slate-600">메모</label>
            <input id="fMemo" class="w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="선택 사항" />
          </div>
          <div class="md:col-span-2 flex gap-2 mt-2">
            <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2 rounded-lg">
              저장하기
            </button>
            <button type="button" id="btnCancelEdit" class="hidden px-3 py-2 border rounded-lg text-xs text-amber-700 border-amber-300">
              수정 취소
            </button>
            <button type="button" id="btnReset" class="px-3 py-2 border rounded-lg text-xs text-slate-600">
              폼 초기화
            </button>
          </div>
        </form>
      </section>

      <section class="bg-white rounded-xl shadow p-4 space-y-4">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <h2 class="text-sm font-bold text-slate-800">지출 그래프 요약</h2>
          <div class="flex gap-2 text-xs">
            <select id="periodType" class="border rounded-lg px-2 py-1.5">
              <option value="month">월별 보기</option>
              <option value="year">연도별 보기</option>
            </select>
            <select id="periodValue" class="border rounded-lg px-2 py-1.5"></select>
          </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div class="border rounded-xl p-3">
            <h3 class="text-xs font-semibold text-slate-600 mb-2">카테고리 구성</h3>
            <canvas id="categoryDonutChart" height="280"></canvas>
            <p class="mt-2 text-[11px] text-slate-400">
              작은 조각은 내용 대신 ... 으로 표시되고, 마우스를 올리면 상세 내용이 보입니다.
            </p>
          </div>

          <div class="border rounded-xl p-3">
            <h3 class="text-xs font-semibold text-slate-600 mb-2">카테고리별 합계</h3>
            <canvas id="categoryChart" height="280"></canvas>
          </div>
        </div>

        <div class="border rounded-xl p-3">
          <h3 class="text-xs font-semibold text-slate-600 mb-2">기간 흐름</h3>
          <canvas id="trendChart" height="130"></canvas>
        </div>
      </section>

      <section class="bg-white rounded-xl shadow p-4">
        <div class="flex justify-between items-center mb-2 text-xs">
          <h2 class="font-bold text-slate-800">지출 내역</h2>
          <span id="row-count" class="text-slate-400">0건</span>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-[11px]">
            <thead class="bg-slate-100 text-slate-600">
              <tr>
                <th class="px-2 py-1 text-left">날짜</th>
                <th class="px-2 py-1 text-left">카테고리</th>
                <th class="px-2 py-1 text-left">지출처</th>
                <th class="px-2 py-1 text-left">결제수단</th>
                <th class="px-2 py-1 text-right">금액</th>
                <th class="px-2 py-1 text-left">메모</th>
                <th class="px-2 py-1 text-center">관리</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const app = initializeApp({
      apiKey: "AIzaSyBQ9xAaHvj8EetPngUcikGgfXog9-2kvhE",
      authDomain: "household-ledger-c5ff8.firebaseapp.com",
      databaseURL: "https://household-ledger-c5ff8-default-rtdb.firebaseio.com",
      projectId: "household-ledger-c5ff8",
      storageBucket: "household-ledger-c5ff8.firebasestorage.app",
      messagingSenderId: "671578590446",
      appId: "1:671578590446:web:a8463d32a79cf9af17f7ff",
      measurementId: "G-JVX0VJ7778"
    });

    const db = getDatabase(app);
    const auth = getAuth(app);
    const entriesRef = ref(db, "ledgerEntries");
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (Number(n) || 0).toLocaleString("ko-KR") + "원";

    const categoryColorMap = {
      "식비":   { bg: "rgba(239, 68, 68, 0.82)", border: "#dc2626" },
      "육아":   { bg: "rgba(249, 115, 22, 0.82)", border: "#ea580c" },
      "교육":   { bg: "rgba(234, 179, 8, 0.82)", border: "#ca8a04" },
      "주거":   { bg: "rgba(34, 197, 94, 0.82)", border: "#16a34a" },
      "교통":   { bg: "rgba(6, 182, 212, 0.82)", border: "#0891b2" },
      "쇼핑":   { bg: "rgba(59, 130, 246, 0.82)", border: "#2563eb" },
      "의료":   { bg: "rgba(99, 102, 241, 0.82)", border: "#4f46e5" },
      "외식":   { bg: "rgba(168, 85, 247, 0.82)", border: "#9333ea" },
      "통신":   { bg: "rgba(236, 72, 153, 0.82)", border: "#db2777" },
      "생활":   { bg: "rgba(20, 184, 166, 0.82)", border: "#0f766e" },
      "보험":   { bg: "rgba(132, 204, 22, 0.82)", border: "#65a30d" },
      "기타":   { bg: "rgba(148, 163, 184, 0.82)", border: "#64748b" }
    };

    function getCategoryColors(labels) {
      return {
        backgrounds: labels.map(label => (categoryColorMap[label] || categoryColorMap["기타"]).bg),
        borders: labels.map(label => (categoryColorMap[label] || categoryColorMap["기타"]).border)
      };
    }

    let unsubscribeEntries = null;
    let currentRows = [];
    let editingId = null;
    let categoryChart = null;
    let categoryDonutChart = null;
    let trendChart = null;

    function todayStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function isDesktop() {
      return window.innerWidth >= 1024;
    }

    function applyPreset(selectId, inputId) {
      const sel = $(selectId);
      const input = $(inputId);
      if (sel && input && sel.value) input.value = sel.value;
    }

    function exitEditMode() {
      editingId = null;
      $("formTitle").textContent = "새 지출 입력";
      $("editBadge").classList.add("hidden");
      $("btnCancelEdit").classList.add("hidden");
      $("submitBtn").textContent = "저장하기";
    }

    function resetForm() {
      $("entryForm").reset();
      $("fCategoryPreset").value = "";
      $("fMethodPreset").value = "";
      $("fDate").value = todayStr();
      exitEditMode();
    }

    function enterEditMode(row) {
      editingId = row.id;
      $("formTitle").textContent = "지출 내역 수정";
      $("editBadge").classList.remove("hidden");
      $("btnCancelEdit").classList.remove("hidden");
      $("submitBtn").textContent = "수정 저장";

      $("fDate").value = row.date || todayStr();
      $("fCategory").value = row.category || "";
      $("fCategoryPreset").value = row.category || "";
      $("fPlace").value = row.place || "";
      $("fMethod").value = row.method || "";
      $("fMethodPreset").value = row.method || "";
      $("fAmount").value = String(row.amount || "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      $("fMemo").value = row.memo || "";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function getCurrentMonthRows(rows) {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      return rows.filter(r => (r.date || "").startsWith(`${y}-${m}`));
    }

    function updateKpis(rows) {
      const monthRows = getCurrentMonthRows(rows);
      const total = monthRows.reduce((sum, r) => sum + (Number(r.amount) || 0), 0);

      $("kpi-total").textContent = fmt(total);
      $("kpi-count").textContent = `${monthRows.length}건`;
      $("kpi-avg").textContent = monthRows.length ? fmt(Math.round(total / monthRows.length)) : "0원";
      $("kpi-updated").textContent = rows.length ? new Date().toLocaleString("ko-KR") : "-";
    }

    function groupByCategory(rows) {
      const map = {};
      rows.forEach(r => {
        const key = r.category || "기타";
        map[key] = (map[key] || 0) + (Number(r.amount) || 0);
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    function buildMonthOptions(rows) {
      return [...new Set(rows.map(r => (r.date || "").slice(0, 7)).filter(Boolean))].sort().reverse();
    }

    function buildYearOptions(rows) {
      return [...new Set(rows.map(r => (r.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
    }

    function fillPeriodOptions(rows) {
      const type = $("periodType").value;
      const options = type === "month" ? buildMonthOptions(rows) : buildYearOptions(rows);
      const select = $("periodValue");
      const current = select.value;

      select.innerHTML = "";

      options.forEach(v => {
        const option = document.createElement("option");
        option.value = v;
        option.textContent = type === "month" ? `${v} 기준` : `${v}년 기준`;
        select.appendChild(option);
      });

      if (options.includes(current)) {
        select.value = current;
      } else if (options.length) {
        select.value = options[0];
      }
    }

    function getFilteredRows(rows) {
      const type = $("periodType").value;
      const value = $("periodValue").value;
      if (!value) return [];
      if (type === "month") return rows.filter(r => (r.date || "").startsWith(value));
      return rows.filter(r => (r.date || "").startsWith(value));
    }

    function buildTrendData(rows, type, selectedValue) {
      if (!selectedValue) return { labels: [], sums: [], label: "기간 지출" };

      if (type === "month") {
        const baseDate = new Date(selectedValue + "-01");
        const year = baseDate.getFullYear();
        const month = baseDate.getMonth();
        const lastDay = new Date(year, month + 1, 0).getDate();

        const labels = Array.from({ length: lastDay }, (_, i) => String(i + 1));
        const sums = Array(lastDay).fill(0);

        rows.forEach(r => {
          const day = Number((r.date || "").slice(8, 10));
          if (day >= 1 && day <= lastDay) sums[day - 1] += Number(r.amount) || 0;
        });

        return { labels, sums, label: `${selectedValue} 일별 지출` };
      }

      const labels = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
      const sums = Array(12).fill(0);

      rows.forEach(r => {
        const month = Number((r.date || "").slice(5, 7));
        if (month >= 1 && month <= 12) sums[month - 1] += Number(r.amount) || 0;
      });

      return { labels, sums, label: `${selectedValue} 월별 지출` };
    }

    function renderCharts(rows, filteredRows) {
      const categoryData = groupByCategory(filteredRows);
      const type = $("periodType").value;
      const selected = $("periodValue").value;
      const trendData = buildTrendData(filteredRows, type, selected);

      const categoryLabels = categoryData.map(v => v[0]);
      const categoryValues = categoryData.map(v => v[1]);
      const total = categoryValues.reduce((a, b) => a + b, 0);
      const categoryColors = getCategoryColors(categoryLabels);

      if (categoryChart) categoryChart.destroy();
      if (categoryDonutChart) categoryDonutChart.destroy();
      if (trendChart) trendChart.destroy();

      categoryDonutChart = new Chart($("categoryDonutChart"), {
        type: "doughnut",
        data: {
          labels: categoryLabels,
          datasets: [{
            data: categoryValues,
            backgroundColor: categoryColors.backgrounds,
            borderColor: "#ffffff",
            borderWidth: 2,
            hoverOffset: 6
          }]
        },
        plugins: [ChartDataLabels],
        options: {
          responsive: true,
          layout: { padding: 12 },
          cutout: "42%",
          plugins: {
            legend: { display: false },
            datalabels: {
              color: "#ffffff",
              textAlign: "center",
              font: function(context) {
                const value = context.dataset.data[context.dataIndex];
                const pct = total ? (value / total) * 100 : 0;
                const desktopPlus = isDesktop() ? 2 : 0;
                return {
                  weight: "700",
                  size: (pct >= 20 ? 18 : 15) + desktopPlus,
                  lineHeight: 1.15
                };
              },
              formatter: function(value, context) {
                const label = context.chart.data.labels[context.dataIndex];
                const pct = total ? (value / total) * 100 : 0;

                if (pct < 8) return "...";

                const shortLabel = String(label).length > 6 ? String(label).slice(0, 6) : String(label);
                return [
                  shortLabel,
                  Number(value).toLocaleString("ko-KR") + "원",
                  pct.toFixed(1) + "%"
                ];
              },
              anchor: "center",
              align: "center",
              offset: 0,
              clamp: true,
              clip: true,
              textStrokeColor: "rgba(0,0,0,0.18)",
              textStrokeWidth: 2
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const value = context.raw || 0;
                  const pct = total ? ((value / total) * 100).toFixed(1) : "0.0";
                  return `${context.label}: ${Number(value).toLocaleString("ko-KR")}원 (${pct}%)`;
                }
              }
            }
          }
        }
      });

      categoryChart = new Chart($("categoryChart"), {
        type: "bar",
        data: {
          labels: categoryLabels,
          datasets: [{
            label: "카테고리별 지출",
            data: categoryValues,
            backgroundColor: categoryColors.backgrounds,
            borderColor: categoryColors.borders,
            borderWidth: 1.5,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.label}: ${Number(context.raw).toLocaleString("ko-KR")}원`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#475569" },
              grid: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: "#475569",
                callback: (value) => Number(value).toLocaleString("ko-KR") + "원"
              }
            }
          }
        }
      });

      trendChart = new Chart($("trendChart"), {
        type: "line",
        data: {
          labels: trendData.labels,
          datasets: [{
            label: trendData.label,
            data: trendData.sums,
            borderColor: "#0f766e",
            backgroundColor: "rgba(20, 184, 166, 0.18)",
            fill: true,
            tension: 0.25,
            pointBackgroundColor: "#0f766e",
            pointBorderColor: "#ffffff",
            pointBorderWidth: 2,
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.dataset.label}: ${Number(context.raw).toLocaleString("ko-KR")}원`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: "#475569" },
              grid: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: "#475569",
                callback: (value) => Number(value).toLocaleString("ko-KR") + "원"
              }
            }
          }
        }
      });
    }

    function renderTable(filteredRows) {
      const tbody = $("tableBody");
      tbody.innerHTML = "";
      $("row-count").textContent = `${filteredRows.length}건`;

      filteredRows.forEach((r) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50";

        tr.innerHTML = `
          <td class="px-2 py-1 whitespace-nowrap">${r.date || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.category || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.place || "-"}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.method || "-"}</td>
          <td class="px-2 py-1 text-right font-semibold">${fmt(r.amount)}</td>
          <td class="px-2 py-1 whitespace-nowrap">${r.memo || "-"}</td>
          <td class="px-2 py-1 text-center">
            <div class="flex justify-center gap-1">
              <button data-edit="${r.id}" class="text-[10px] text-indigo-600 border border-indigo-500 px-1.5 py-0.5 rounded edit-btn">수정</button>
              <button data-id="${r.id}" class="text-[10px] text-rose-500 border border-rose-500 px-1.5 py-0.5 rounded delete-btn">삭제</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-edit");
          const row = currentRows.find(r => r.id === id);
          if (row) enterEditMode(row);
        };
      });

      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-id");
          if (confirm("이 내역을 삭제할까요?")) {
            try {
              await remove(ref(db, "ledgerEntries/" + id));
              if (editingId === id) resetForm();
            } catch (err) {
              console.error(err);
              alert("삭제 실패: " + err.message);
            }
          }
        };
      });
    }

    function renderFilteredView() {
      fillPeriodOptions(currentRows);
      const filteredRows = getFilteredRows(currentRows);
      renderCharts(currentRows, filteredRows);
      renderTable(filteredRows);
    }

    function bindAppEvents() {
      $("fCategoryPreset").addEventListener("change", () => applyPreset("fCategoryPreset", "fCategory"));
      $("fMethodPreset").addEventListener("change", () => applyPreset("fMethodPreset", "fMethod"));

      $("fAmount").addEventListener("input", (e) => {
        const onlyNum = e.target.value.replace(/[^0-9]/g, "");
        e.target.value = onlyNum.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      });

      $("btnReset").addEventListener("click", resetForm);
      $("btnCancelEdit").addEventListener("click", resetForm);

      $("periodType").addEventListener("change", () => renderFilteredView());
      $("periodValue").addEventListener("change", () => renderFilteredView());

      window.addEventListener("resize", () => {
        renderFilteredView();
      });

      $("entryForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const user = auth.currentUser;
        if (!user) {
          alert("먼저 로그인해주세요.");
          return;
        }

        const date = $("fDate").value;
        const category = $("fCategory").value.trim() || "기타";
        const place = $("fPlace").value.trim();
        const method = $("fMethod").value.trim();
        const amountNum = Number($("fAmount").value.replace(/[^0-9]/g, "")) || 0;
        const memo = $("fMemo").value.trim();

        if (!date || !place || !method || amountNum <= 0) {
          alert("날짜 / 지출처 / 결제수단 / 금액을 확인해주세요.");
          return;
        }

        try {
          if (editingId) {
            await update(ref(db, "ledgerEntries/" + editingId), {
              date,
              category,
              place,
              method,
              amount: amountNum,
              memo,
              updatedAt: Date.now(),
              updatedBy: user.email || ""
            });
          } else {
            const newRef = push(entriesRef);
            await set(newRef, {
              date,
              category,
              place,
              method,
              amount: amountNum,
              memo,
              createdAt: Date.now(),
              createdBy: user.email || ""
            });
          }
          resetForm();
        } catch (err) {
          console.error(err);
          alert("저장 실패: " + err.message);
        }
      });

      $("loginBtn").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!email || !password) {
          alert("이메일과 비밀번호를 입력해주세요.");
          return;
        }

        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          console.error(err);
          alert("로그인 실패: " + err.message);
        }
      });

      $("signupBtn").addEventListener("click", async () => {
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!email || !password) {
          alert("이메일과 비밀번호를 입력해주세요.");
          return;
        }

        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("회원가입 완료. 이제 로그인해서 사용하세요.");
        } catch (err) {
          console.error(err);
          alert("회원가입 실패: " + err.message);
        }
      });

      $("logoutBtn").addEventListener("click", async () => {
        try {
          await signOut(auth);
        } catch (err) {
          console.error(err);
          alert("로그아웃 실패: " + err.message);
        }
      });
    }

    function startLedgerListener() {
      if (unsubscribeEntries) unsubscribeEntries();

      unsubscribeEntries = onValue(entriesRef, (snap) => {
        const data = snap.val() || {};

        currentRows = Object.entries(data)
          .map(([id, v]) => ({ id, ...v }))
          .sort((a, b) => {
            if (a.date === b.date) {
              return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
            }
            return a.date < b.date ? 1 : -1;
          });

        updateKpis(currentRows);
        renderFilteredView();
        $("sync-status").textContent = "실시간 연결됨";
      }, (err) => {
        console.error(err);
        $("sync-status").textContent = "연결 오류";
      });
    }

    bindAppEvents();
    $("fDate").value = todayStr();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        $("authSection").classList.add("hidden");
        $("appSection").classList.remove("hidden");
        $("userInfo").textContent = `로그인 계정: ${user.email}`;
        $("sync-status").textContent = "연결 중...";
        startLedgerListener();
      } else {
        $("authSection").classList.remove("hidden");
        $("appSection").classList.add("hidden");
        $("userInfo").textContent = "";
        $("sync-status").textContent = "로그인 필요";
        if (unsubscribeEntries) {
          unsubscribeEntries();
          unsubscribeEntries = null;
        }
      }
    });
  </script>
</body>
</html>
